<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Interaktif Anatomi Telinga & Gelombang Bunyi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            bg: '#f8fafc',
                            card: '#ffffff',
                            border: '#e2e8f0',
                            pink: '#f472b6',
                            softpink: '#fce7f3',
                            blue: '#38bdf8',
                            softblue: '#e0f2fe',
                            teal: '#14b8a6',
                            softteal: '#ccfbf1',
                            amber: '#f59e0b',
                            softamber: '#fef3c7',
                            purple: '#a855f7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Custom Soft Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* SVG Interactive Elements Styling */
        .ear-organ {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ear-organ:hover {
            filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.8)) brightness(1.05);
        }
        .ear-organ.active {
            filter: drop-shadow(0 0 14px rgba(236, 72, 153, 0.9)) brightness(1.1);
        }

        /* Interactive Pin Marker Animation */
        .pin-marker {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .pin-marker:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-sky-200 selection:text-sky-900">

    <!-- Header Section -->
    <header class="border-b border-slate-200 bg-white/90 backdrop-blur sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-gradient-to-tr from-sky-400 to-teal-400 rounded-xl shadow-md text-white">
                    <i data-lucide="activity" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-sky-600 via-teal-600 to-pink-600 bg-clip-text text-transparent">
                        Simulasi Anatomi Telinga & Gelombang Bunyi
                    </h1>
                    <p class="text-xs text-slate-500 font-medium">Media Pembelajaran Interaktif Biologi Auditori & Fisika Gelombang</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full border border-emerald-200 font-medium shadow-sm">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>Web Audio API Ready</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT COLUMN: Audio Generator Controls & Oscilloscope (4 Cols) -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            
            <!-- Audio Generator Controls Card -->
            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm tracking-wide uppercase">
                        <i data-lucide="sliders" class="w-4 h-4 text-sky-500"></i> Generator Suara
                    </h2>
                    <button id="btnPlay" class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-sky-500 to-teal-500 hover:from-sky-600 hover:to-teal-600 text-white font-semibold rounded-xl transition shadow-md shadow-sky-200 active:scale-95 text-xs">
                        <i data-lucide="play" class="w-4 h-4 fill-current" id="playIcon"></i>
                        <span id="playBtnText">Mulai Suara</span>
                    </button>
                </div>

                <!-- Frequency Slider -->
                <div class="space-y-2 mb-5">
                    <div class="flex justify-between text-xs font-semibold">
                        <label class="text-slate-700 flex items-center gap-1.5">
                            <i data-lucide="radio" class="w-4 h-4 text-sky-500"></i> Frekuensi (Pitch / Nada)
                        </label>
                        <span id="freqVal" class="font-mono text-sky-600 text-sm bg-sky-50 px-2 py-0.5 rounded border border-sky-200">440 Hz</span>
                    </div>
                    <input type="range" id="sliderFreq" min="100" max="4000" value="440" step="1" 
                           class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-sky-500 border border-slate-200">
                    <div class="flex justify-between text-[10px] text-slate-400 font-medium">
                        <span>100 Hz (Bass)</span>
                        <span>1000 Hz</span>
                        <span>4000 Hz (Treble)</span>
                    </div>
                </div>

                <!-- Amplitude / Volume Slider -->
                <div class="space-y-2 mb-5">
                    <div class="flex justify-between text-xs font-semibold">
                        <label class="text-slate-700 flex items-center gap-1.5">
                            <i data-lucide="volume-2" class="w-4 h-4 text-pink-500"></i> Amplitudo (Volume)
                        </label>
                        <span id="ampVal" class="font-mono text-pink-600 text-sm bg-pink-50 px-2 py-0.5 rounded border border-pink-200">50%</span>
                    </div>
                    <input type="range" id="sliderAmp" min="0" max="100" value="50" step="1" 
                           class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-pink-500 border border-slate-200">
                    <div class="flex justify-between text-[10px] text-slate-400 font-medium
